    function formatDateBR(isoStr) {
      if (!isoStr) return '--/--/----';
      const clean = isoStr.split('T')[0];
      const parts = clean.split('-');
      if (parts.length !== 3) return isoStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatDateTimeBR(isoStr) {
      if (!isoStr) return 'Agora mesmo';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getOriginMeta(originKey) {
      if (!originKey || !ORIGINS[originKey]) return ORIGINS.nao_classificado;
      return ORIGINS[originKey];
    }

    function getPriorityMeta(prioKey) {
      return PRIORITIES[prioKey] || PRIORITIES.alta;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-indigo-600 text-white',
        warning: 'bg-amber-600 text-white'
      };
      const iconName = type === 'success' ? 'check-circle-2' : type === 'error' ? 'x-circle' : 'info';
      toast.className = `${styles[type] || styles.info} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-2.5 fade-in`;
      toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i><span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      lucide.createIcons({ nodes: [toast] });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    // =========================================================================
    // PERSISTÊNCIA (LOCALSTORAGE)
    // =========================================================================
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.errors = Array.isArray(parsed.errors) ? parsed.errors.map(normalizeErrorRecord) : [];
          state.subjects = Array.isArray(parsed.subjects) && parsed.subjects.length > 0 ? parsed.subjects : JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
          state.history = Array.isArray(parsed.history) ? parsed.history : [];
          state.lastSavedAt = parsed.lastSavedAt || new Date().toISOString();
        } else {
          state.errors = [];
          state.subjects = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
          state.history = [];
          state.lastSavedAt = new Date().toISOString();
          saveState(false);
        }
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        state.subjects = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
      }
      syncSubjectsFromErrors();
      updateBadgesAndSyncUI();
    }

    function normalizeErrorRecord(rec) {
      // Preserva registros antigos sem origem como 'nao_classificado', sem atribuir categoria automaticamente
      const validOrigins = ['desconhecimento', 'confusao', 'esquecimento', 'interpretacao'];
      const origin = validOrigins.includes(rec.origin) ? rec.origin : 'nao_classificado';
      const validPrios = ['alta', 'media', 'superado'];
      const priority = validPrios.includes(rec.priority) ? rec.priority : 'alta';
      return {
        id: rec.id || generateId('err'),
        subject: (rec.subject || 'Geral').trim(),
        topic: (rec.topic || 'Geral').trim(),
        description: rec.description || '',
        correction: rec.correction || '',
        prevention: rec.prevention || '',
        priority,
        origin,
        reference: rec.reference || '',
        date: rec.date || todayISO(),
        createdAt: rec.createdAt || new Date().toISOString(),
        updatedAt: rec.updatedAt || new Date().toISOString(),
        overcomeAt: rec.overcomeAt || (priority === 'superado' ? (rec.updatedAt || new Date().toISOString()) : null),
        reviewCount: Number(rec.reviewCount || 0)
      };
    }

    function syncSubjectsFromErrors() {
      const map = new Map();
      state.subjects.forEach(s => {
        const key = s.name.trim().toLowerCase();
        if (!map.has(key)) {
          map.set(key, { id: s.id || generateId('sub'), name: s.name.trim(), topics: [...new Set((s.topics || []).map(t => t.trim()).filter(Boolean))] });
        }
      });
      state.errors.forEach(err => {
        const sName = err.subject.trim();
        const key = sName.toLowerCase();
        if (!map.has(key)) {
          map.set(key, { id: generateId('sub'), name: sName, topics: [] });
        }
        const subj = map.get(key);
        const tName = err.topic.trim();
        if (tName && !subj.topics.some(t => t.toLowerCase() === tName.toLowerCase())) {
          subj.topics.push(tName);
        }
      });
      state.subjects = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    }

    function saveState(logSync = true) {
      state.lastSavedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (logSync) updateBadgesAndSyncUI();
      } catch (e) {
        showToast('Erro ao salvar no navegador. Verifique o espaço disponível.', 'error');
      }
    }

    function recordHistory(action, details) {
      state.history.unshift({
        id: generateId('hist'),
        at: new Date().toISOString(),
        action,
        details
      });
      if (state.history.length > 120) state.history = state.history.slice(0, 120);
    }

    function updateBadgesAndSyncUI() {
      const total = state.errors.length;
      const pendentes = state.errors.filter(e => e.priority !== 'superado').length;
      const bTotal = document.getElementById('badge-total-erros');
      const bPend = document.getElementById('badge-pendentes');
      if (bTotal) bTotal.textContent = total;
      if (bPend) bPend.textContent = pendentes;

      const timeStr = state.lastSavedAt ? new Date(state.lastSavedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
      const headerSync = document.getElementById('header-sync-status');
      const sidebarSync = document.getElementById('sidebar-sync-time');
      if (headerSync) headerSync.textContent = timeStr ? `Salvo às ${timeStr}` : 'Salvo localmente';
      if (sidebarSync) sidebarSync.textContent = timeStr ? `Último salvamento: ${timeStr}` : 'Salvo automaticamente';
    }

    function pickMotivationalQuote(forceNew = false) {
      const lastIdxRaw = localStorage.getItem(LAST_QUOTE_KEY);
      const lastIdx = lastIdxRaw !== null ? parseInt(lastIdxRaw, 10) : -1;
      let idx = Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length);
      if (MOTIVATIONAL_QUOTES.length > 1 && idx === lastIdx) {
        idx = (idx + 1 + Math.floor(Math.random() * (MOTIVATIONAL_QUOTES.length - 1))) % MOTIVATIONAL_QUOTES.length;
      }
      localStorage.setItem(LAST_QUOTE_KEY, String(idx));
      currentQuote = MOTIVATIONAL_QUOTES[idx];
      if (forceNew) {
        const el = document.getElementById('motivational-quote-text');
        if (el) {
          el.classList.remove('fade-in');
          void el.offsetWidth;
          el.textContent = `"${currentQuote}"`;
          el.classList.add('fade-in');
        }
      }
    }

    // =========================================================================
    // MÉTRICAS AUXILIARES
    // =========================================================================
    function computeMetrics() {
      const total = state.errors.length;
      const alta = state.errors.filter(e => e.priority === 'alta').length;
      const media = state.errors.filter(e => e.priority === 'media').length;
      const superado = state.errors.filter(e => e.priority === 'superado').length;
      const pctSuperado = total > 0 ? Math.round((superado / total) * 100) : 0;

      const subjectsWithErrors = new Set(state.errors.map(e => e.subject));
      const subjectCount = state.subjects.length;

      // Por matéria
      const bySubject = {};
      state.errors.forEach(e => {
        if (!bySubject[e.subject]) bySubject[e.subject] = { total: 0, alta: 0, media: 0, superado: 0 };
        bySubject[e.subject].total++;
        bySubject[e.subject][e.priority]++;
      });

      // Por tópico
      const byTopic = {};
      state.errors.forEach(e => {
        const key = `${e.subject}|||${e.topic}`;
        if (!byTopic[key]) byTopic[key] = { subject: e.subject, topic: e.topic, total: 0, alta: 0, media: 0, superado: 0, pending: 0 };
        byTopic[key].total++;
        byTopic[key][e.priority]++;
        if (e.priority !== 'superado') byTopic[key].pending++;
      });

      // Por origem
      const byOrigin = {
        desconhecimento: 0,
        confusao: 0,
        esquecimento: 0,
        interpretacao: 0,
        nao_classificado: 0
      };
      state.errors.forEach(e => {
        const k = ORIGINS[e.origin] ? e.origin : 'nao_classificado';
        byOrigin[k]++;
      });

      return { total, alta, media, superado, pctSuperado, subjectCount, subjectsWithErrors: subjectsWithErrors.size, bySubject, byTopic, byOrigin };
    }

    function updateTopicSuggestions() {
      const sel = document.getElementById('form-subject');
      const dl = document.getElementById('topic-datalist');
      if (!sel || !dl) return;
      const subj = state.subjects.find(s => s.name === sel.value);
      const topics = subj ? subj.topics : [];
      dl.innerHTML = topics.map(t => `<option value="${escapeHTML(t)}"></option>`).join('');
    }

    function toggleInlineNewSubject() {
      const box = document.getElementById('inline-new-subject-box');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        document.getElementById('inline-new-subject-input').focus();
      }
    }

    function addInlineSubject() {
      const input = document.getElementById('inline-new-subject-input');
      const name = input.value.trim();
      if (!name) return showToast('Digite o nome da nova matéria.', 'warning');
      const exists = state.subjects.find(s => s.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        document.getElementById('form-subject').value = exists.name;
        toggleInlineNewSubject();
        updateTopicSuggestions();
        return showToast('Essa matéria já existia e foi selecionada.', 'info');
      }
      state.subjects.push({ id: generateId('sub'), name, topics: [] });
      state.subjects.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
      saveState();

      const sel = document.getElementById('form-subject');
      sel.innerHTML = '<option value="">Selecione uma matéria...</option>' + state.subjects.map(s => `<option value="${escapeHTML(s.name)}" ${s.name === name ? 'selected' : ''}>${escapeHTML(s.name)}</option>`).join('');
      input.value = '';
      toggleInlineNewSubject();
      updateTopicSuggestions();
      showToast(`Matéria "${name}" adicionada!`, 'success');
    }

    function handleSaveError(event) {
      event.preventDefault();
      const id = document.getElementById('form-id').value.trim();
      const subject = document.getElementById('form-subject').value.trim();
      const topic = document.getElementById('form-topic').value.trim();
      const description = document.getElementById('form-description').value.trim();
      const correction = document.getElementById('form-correction').value.trim();
      const prevention = document.getElementById('form-prevention').value.trim();
      const priorityEl = document.querySelector('input[name="priority"]:checked');
      const originEl = document.querySelector('input[name="origin"]:checked');
      const reference = document.getElementById('form-reference').value.trim();
      const date = document.getElementById('form-date').value || todayISO();

      const originErrMsg = document.getElementById('origin-error-msg');
      if (!originEl) {
        originErrMsg.classList.remove('hidden');
        showToast('Selecione a origem do erro antes de salvar.', 'error');
        return;
      } else {
        originErrMsg.classList.add('hidden');
      }

      if (!subject || !topic || !description || !correction || !prevention || !priorityEl) {
        showToast('Preencha todos os campos obrigatórios.', 'error');
        return;
      }

      const priority = priorityEl.value;
      const origin = originEl.value;
      const now = new Date().toISOString();

      if (id) {
        const idx = state.errors.findIndex(e => e.id === id);
        if (idx !== -1) {
          const prev = state.errors[idx];
          state.errors[idx] = {
            ...prev,
            subject, topic, description, correction, prevention, priority, origin, reference, date,
            updatedAt: now,
            overcomeAt: priority === 'superado' ? (prev.overcomeAt || now) : null
          };
          recordHistory('Edição de erro', `${subject} > ${topic}`);
          showToast('Registro atualizado com sucesso!', 'success');
        }
      } else {
        const newErr = {
          id: generateId('err'),
          subject, topic, description, correction, prevention, priority, origin, reference, date,
          createdAt: now,
          updatedAt: now,
          overcomeAt: priority === 'superado' ? now : null,
          reviewCount: 0
        };
        state.errors.unshift(newErr);
        recordHistory('Novo erro registrado', `${subject} > ${topic} (${PRIORITIES[priority].short})`);
        showToast('Erro registrado com sucesso!', 'success');
      }

      syncSubjectsFromErrors();
      saveState();
      expandedTopics[`${subject}|||${topic}`] = true;
      navigate('erros');
    }

    // =========================================================================
    // VIEW 3: MEUS ERROS (ORGANIZAÇÃO POR MATÉRIA -> TÓPICO + FILTROS COMBINADOS)
    // =========================================================================
    function getFilteredErrors() {
      const q = filters.search.trim().toLowerCase();
      return state.errors.filter(err => {
        if (filters.subject && err.subject !== filters.subject) return false;
        if (filters.topic && err.topic !== filters.topic) return false;
        if (filters.priority && err.priority !== filters.priority) return false;
        if (filters.origin && err.origin !== filters.origin) return false;
        if (filters.dateFrom && err.date < filters.dateFrom) return false;
        if (filters.dateTo && err.date > filters.dateTo) return false;
        if (q) {
          const haystack = `${err.subject} ${err.topic} ${err.description} ${err.correction} ${err.prevention} ${err.reference}`.toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

    function renderMyErrors(container) {
      const filtered = getFilteredErrors();

      // Tópicos disponíveis para o filtro (conforme matéria selecionada)
      const availableTopics = [...new Set(
        state.errors
          .filter(e => !filters.subject || e.subject === filters.subject)
          .map(e => e.topic)
      )].sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // Agrupar por Matéria -> Tópico
      const grouped = {};
      filtered.forEach(err => {
        if (!grouped[err.subject]) grouped[err.subject] = {};
        if (!grouped[err.subject][err.topic]) grouped[err.subject][err.topic] = [];
        grouped[err.subject][err.topic].push(err);
      });

      const hasActiveFilters = Object.values(filters).some(Boolean);
      const subjectNames = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'pt-BR'));

      container.innerHTML = `
        <div class="space-y-5 fade-in">

            <div>

              <button onclick="expandCollapseAllTopics(false)" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-600 hover:bg-slate-50">Recolher</button>
            </div>
          </div>

          <!-- Painel de Busca e Filtros Combinados -->
          <div class="card-premium p-4 sm:p-5 space-y-3.5">
            <div class="flex flex-col md:flex-row gap-3">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="filter-search" value="${escapeHTML(filters.search)}" oninput="updateFilter('search', this.value)" placeholder="Pesquisar palavras nas descrições, correções, macetes ou referências..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              ${hasActiveFilters ? `
                <button onclick="clearFilters()" class="px-4 py-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold hover:bg-rose-100 flex items-center justify-center gap-1.5 shrink-0">
                  <i data-lucide="filter-x" class="w-4 h-4"></i>
                  Limpar filtros
                </button>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <select onchange="updateFilter('subject', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-400">
                <option value="">Todas as matérias</option>
                ${state.subjects.map(s => `<option value="${escapeHTML(s.name)}" ${filters.subject === s.name ? 'selected' : ''}>${escapeHTML(s.name)}</option>`).join('')}
              </select>

              <select onchange="updateFilter('topic', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-400">
                <option value="">Todos os tópicos</option>
                ${availableTopics.map(t => `<option value="${escapeHTML(t)}" ${filters.topic === t ? 'selected' : ''}>${escapeHTML(t)}</option>`).join('')}
              </select>

              <select onchange="updateFilter('priority', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-400">
                <option value="">Todas as prioridades</option>
                <option value="alta" ${filters.priority === 'alta' ? 'selected' : ''}>🔴 Prioridade Alta</option>
                <option value="media" ${filters.priority === 'media' ? 'selected' : ''}>🟡 Prioridade Média</option>
                <option value="superado" ${filters.priority === 'superado' ? 'selected' : ''}>🟢 Superado</option>
              </select>

              <select onchange="updateFilter('origin', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-400">
                <option value="">Todas as origens</option>
                <option value="desconhecimento" ${filters.origin === 'desconhecimento' ? 'selected' : ''}>Desconhecimento</option>
                <option value="confusao" ${filters.origin === 'confusao' ? 'selected' : ''}>Confusão entre conceitos</option>
                <option value="esquecimento" ${filters.origin === 'esquecimento' ? 'selected' : ''}>Esquecimento</option>
                <option value="interpretacao" ${filters.origin === 'interpretacao' ? 'selected' : ''}>Erro de interpretação</option>
                <option value="nao_classificado" ${filters.origin === 'nao_classificado' ? 'selected' : ''}>Não classificado</option>
              </select>

              <div class="flex items-center gap-1.5">
                <input type="date" value="${filters.dateFrom}" onchange="updateFilter('dateFrom', this.value)" title="Data inicial" class="w-1/2 px-2 py-2 rounded-xl border border-slate-200 bg-slate-50 text-[11px] font-semibold text-slate-700 outline-none" />
                <input type="date" value="${filters.dateTo}" onchange="updateFilter('dateTo', this.value)" title="Data final" class="w-1/2 px-2 py-2 rounded-xl border border-slate-200 bg-slate-50 text-[11px] font-semibold text-slate-700 outline-none" />

            <div class="text-xs text-slate-500 flex items-center justify-between pt-1">
              <span>Exibindo <strong class="text-slate-800">${filtered.length}</strong> de ${state.errors.length} registro(s)</span>

          </div>

          <!-- Listagem Hierárquica: Matéria -> Tópico -> Erros -->
          ${filtered.length === 0 ? `

                    <div class="px-5 py-3.5 gradient-soft border-b border-indigo-100 flex items-center justify-between flex-wrap gap-2">
                      <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg gradient-brand text-white flex items-center justify-center shadow-xs">
                          <i data-lucide="book-marked" class="w-4 h-4"></i>
                        </div>
                        <div>
                          <h3 class="font-extrabold text-slate-900 text-base">${escapeHTML(subjectName)}</h3>
                          <p class="text-[11px] text-slate-500">${topicNames.length} tópico(s) • ${totalInSubj} erro(s)</p>
                        </div>
                      </div>
                    </div>

                    <!-- Tópicos da Matéria -->
                    <div class="divide-y divide-slate-100">
                      ${topicNames.map(topicName => {

                        const altaC = topicErrors.filter(e => e.priority === 'alta').length;
                        const mediaC = topicErrors.filter(e => e.priority === 'media').length;
                        const supC = topicErrors.filter(e => e.priority === 'superado').length;

                        return `
                          <div>
                            <button onclick="toggleTopicGroup('${escapeHTML(topicKey).replace(/'/g, "\\'")}')" class="w-full px-5 py-3.5 flex items-center justify-between gap-3 hover:bg-slate-50/80 transition text-left">
                              <div class="flex items-center gap-2.5 min-w-0">
                                <i data-lucide="${isOpen ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4 text-indigo-600 shrink-0"></i>
                                <span class="font-bold text-slate-800 text-sm truncate">${escapeHTML(topicName)}</span>
                                <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">${topicErrors.length}</span>
                              </div>
                              <div class="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                                ${altaC ? `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">🔴 ${altaC}</span>` : ''}
                                ${mediaC ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">🟡 ${mediaC}</span>` : ''}
                                ${supC ? `<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">🟢 ${supC}</span>` : ''}
                              </div>
                            </button>

                            ${isOpen ? `
                              <div class="px-4 sm:px-5 pb-4 pt-1 space-y-3 bg-slate-50/40">
                                ${topicErrors.map(err => renderErrorCard(err)).join('')}
                              </div>
                            ` : ''}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderErrorCard(err) {
      const p = getPriorityMeta(err.priority);
      const o = getOriginMeta(err.origin);

      return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs hover:border-indigo-200 transition">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${p.badgeClass}">${p.dot} ${p.label}</span>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${o.badgeClass} inline-flex items-center gap-1">
                <i data-lucide="${o.icon}" class="w-3 h-3"></i>
                ${o.label}
              </span>
              <span class="text-xs text-slate-400 flex items-center gap-1">
                <i data-lucide="calendar" class="w-3 h-3"></i>

              </span>
            </div>

            <div class="flex items-center gap-1.5">
              <button onclick="openDetailModal('${err.id}')" class="px-2.5 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold hover:bg-indigo-100 flex items-center gap-1">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i> Detalhes
              </button>
              <button onclick="openRegisterForm('${err.id}')" class="p-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100" title="Editar registro">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="confirmDeleteError('${err.id}')" class="p-1.5 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50" title="Excluir registro">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <p class="text-sm text-slate-800 mt-2.5 leading-relaxed">${escapeHTML(err.description)}</p>

          ${err.prevention ? `
            <div class="mt-2.5 px-3 py-2 rounded-lg bg-amber-50/70 border border-amber-100 text-xs text-amber-900 flex items-start gap-2">
              <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-600 shrink-0 mt-0.5"></i>
              <span><strong>Alerta:</strong> ${escapeHTML(err.prevention)}</span>
            </div>
          ` : ''}

          <!-- Alteração rápida inline de Prioridade e Origem -->
          <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex flex-wrap items-center gap-2">
              <label class="text-slate-500 font-semibold">Alterar rápido:</label>
              <select onchange="quickUpdatePriority('${err.id}', this.value)" class="px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-50 font-semibold text-slate-700 text-xs outline-none focus:border-indigo-400">
                <option value="alta" ${err.priority === 'alta' ? 'selected' : ''}>🔴 Prioridade Alta</option>
                <option value="media" ${err.priority === 'media' ? 'selected' : ''}>🟡 Prioridade Média</option>
                <option value="superado" ${err.priority === 'superado' ? 'selected' : ''}>🟢 Superado</option>
              </select>

              <select onchange="quickUpdateOrigin('${err.id}', this.value)" class="px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-50 font-semibold text-slate-700 text-xs outline-none focus:border-indigo-400">
                ${err.origin === 'nao_classificado' ? '<option value="nao_classificado" selected>Não classificado</option>' : ''}
                <option value="desconhecimento" ${err.origin === 'desconhecimento' ? 'selected' : ''}>Origem: Desconhecimento</option>
                <option value="confusao" ${err.origin === 'confusao' ? 'selected' : ''}>Origem: Confusão entre conceitos</option>
                <option value="esquecimento" ${err.origin === 'esquecimento' ? 'selected' : ''}>Origem: Esquecimento</option>
                <option value="interpretacao" ${err.origin === 'interpretacao' ? 'selected' : ''}>Origem: Erro de interpretação</option>
              </select>
            </div>
            ${err.reference ? `<span class="text-[11px] text-slate-400 truncate max-w-[220px]" title="${escapeHTML(err.reference)}">Ref.: ${escapeHTML(err.reference)}</span>` : ''}
          </div>
        </div>
      `;
    }

    function updateFilter(key, val) {
      filters[key] = val;
      if (key === 'subject') filters.topic = '';
      renderMyErrors(document.getElementById('app-content'));
      lucide.createIcons();
      if (key === 'search') {
        const inp = document.getElementById('filter-search');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    }

    function clearFilters() {
      filters = { search: '', subject: '', topic: '', priority: '', origin: '', dateFrom: '', dateTo: '' };
      renderMyErrors(document.getElementById('app-content'));
      lucide.createIcons();
    }

    function toggleTopicGroup(key) {
      const curr = expandedTopics[key];
      expandedTopics[key] = curr === undefined ? false : !curr;
      renderMyErrors(document.getElementById('app-content'));
      lucide.createIcons();
    }

    function expandCollapseAllTopics(expand) {
      state.errors.forEach(e => {
        expandedTopics[`${e.subject}|||${e.topic}`] = expand;
      });
      renderMyErrors(document.getElementById('app-content'));
      lucide.createIcons();
    }

    function quickUpdatePriority(id, newPrio) {
      const err = state.errors.find(e => e.id === id);
      if (!err) return;
      err.priority = newPrio;
      err.updatedAt = new Date().toISOString();
      if (newPrio === 'superado') err.overcomeAt = err.overcomeAt || err.updatedAt;
      else err.overcomeAt = null;
      recordHistory('Prioridade alterada', `${err.subject} > ${err.topic} → ${PRIORITIES[newPrio].label}`);
      saveState();
      showToast(`Prioridade alterada para ${PRIORITIES[newPrio].label}!`, 'success');
      navigate(currentView);
    }

    function quickUpdateOrigin(id, newOrigin) {
      const err = state.errors.find(e => e.id === id);
      if (!err) return;
      err.origin = newOrigin;
      err.updatedAt = new Date().toISOString();
      recordHistory('Origem alterada', `${err.subject} > ${err.topic} → ${getOriginMeta(newOrigin).label}`);
      saveState();
      showToast(`Origem atualizada para "${getOriginMeta(newOrigin).label}"!`, 'info');
      navigate(currentView);
    }

    function confirmDeleteError(id) {
      const err = state.errors.find(e => e.id === id);
      if (!err) return;
      openConfirmModal(
        'Excluir registro de erro?',
        `Tem certeza que deseja excluir este erro de "${err.subject} - ${err.topic}"? Essa ação não pode ser desfeita.`,
        () => {
          state.errors = state.errors.filter(e => e.id !== id);
          recordHistory('Erro excluído', `${err.subject} > ${err.topic}`);
          saveState();
          closeDetailModal();
          showToast('Registro excluído.', 'info');
          navigate(currentView);
        }
      );
    }

    // =========================================================================
    // MODAL DE DETALHES
    // =========================================================================

      if (!err) return;
      const p = getPriorityMeta(err.priority);
      const o = getOriginMeta(err.origin);

      const isLink = err.reference && /^https?:\/\//i.test(err.reference.trim());

      document.getElementById('detail-modal-body').innerHTML = `
        <div class="p-6 border-b border-slate-100 flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${p.badgeClass}">${p.dot} ${p.label}</span>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${o.badgeClass}">${o.label}</span>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900 mt-2">${escapeHTML(err.subject)}</h3>
            <p class="text-sm font-semibold text-indigo-600">${escapeHTML(err.topic)}</p>
          </div>
          <button onclick="closeDetailModal()" class="p-2 rounded-xl text-slate-400 hover:bg-slate-100">

          </button>
        </div>

        <div class="p-6 space-y-4">
          <div>
            <p class="text-xs font-bold uppercase tracking-wide text-slate-400">Descrição do Erro</p>
            <p class="text-sm text-slate-800 mt-1 whitespace-pre-line leading-relaxed bg-slate-50 p-3.5 rounded-xl border border-slate-100">${escapeHTML(err.description)}</p>
          </div>

          <div>
            <p class="text-xs font-bold uppercase tracking-wide text-emerald-600">Correção / Entendimento Correto</p>
            <p class="text-sm text-slate-800 mt-1 whitespace-pre-line leading-relaxed bg-emerald-50/60 p-3.5 rounded-xl border border-emerald-100">${escapeHTML(err.correction)}</p>
          </div>

          <div>
            <p class="text-xs font-bold uppercase tracking-wide text-amber-600">Como Evitar Novamente (Macete / Alerta)</p>
            <p class="text-sm text-amber-950 mt-1 whitespace-pre-line leading-relaxed bg-amber-50/70 p-3.5 rounded-xl border border-amber-100">${escapeHTML(err.prevention)}</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 text-xs text-slate-500">

              <span class="font-bold text-slate-700 block">Questão de referência</span>
              ${err.reference ? (isLink ? `<a href="${escapeHTML(err.reference)}" target="_blank" rel="noopener" class="text-indigo-600 underline break-all">${escapeHTML(err.reference)}</a>` : `<span>${escapeHTML(err.reference)}</span>`) : '<span>Não informada</span>'}

              <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Editar

      const modal = document.getElementById('detail-modal');

      modal.classList.add('flex');

    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // =========================================================================
    // VIEW 4: MEU SEGUNDO CICLO (REVISÃO ATIVA)
    // =========================================================================
    function renderSecondCycle(container) {
      const pending = state.errors.filter(e => e.priority !== 'superado');
      const highErrors = pending.filter(e => e.priority === 'alta');
      const medErrors = pending.filter(e => e.priority === 'media');

      // Matérias com maior concentração de dificuldades (pendentes)
      const pendingBySubj = {};
      const pendingByTopic = {};
      pending.forEach(e => {
        pendingBySubj[e.subject] = (pendingBySubj[e.subject] || 0) + 1;
        const tk = `${e.subject}|||${e.topic}`;

    function completeReview(id, newPriority) {
      const err = state.errors.find(e => e.id === id);
      if (!err) return;
      err.priority = newPriority;
      err.reviewCount = Number(err.reviewCount || 0) + 1;
      err.updatedAt = new Date().toISOString();
      if (newPriority === 'superado') {
        err.overcomeAt = err.overcomeAt || err.updatedAt;
      } else {
        err.overcomeAt = null;
      }
      recordHistory('Revisão concluída (Segundo Ciclo)', `${err.subject} > ${err.topic} → ${PRIORITIES[newPriority].label}`);
      saveState();
      closeReviewModal();
      showToast(
        newPriority === 'superado'
          ? 'Parabéns! Erro marcado como SUPERADO e preservado no histórico.'
          : `Revisão registrada! Classificação atual: ${PRIORITIES[newPriority].label}.`,
        'success'
      );
      navigate('ciclo');
    }

    function closeReviewModal() {
      const modal = document.getElementById('review-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function renderEvolutionCharts(m) {
      // 1. Gráfico de Origens
      const originKeys = ['desconhecimento', 'confusao', 'esquecimento', 'interpretacao'];
      if (m.byOrigin.nao_classificado > 0) originKeys.push('nao_classificado');

      const ctxOrig = document.getElementById('evo-origin-chart');
      if (ctxOrig) {
        activeCharts.evoOrigin = new Chart(ctxOrig, {
          type: 'bar',
          data: {
            labels: originKeys.map(k => ORIGINS[k].label),
            datasets: [{
              label: 'Quantidade de erros',
              data: originKeys.map(k => m.byOrigin[k]),
              backgroundColor: originKeys.map(k => ORIGINS[k].colorHex),
              borderRadius: 8,
              maxBarThickness: 44
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } },
              y: { grid: { display: false }, ticks: { font: { size: 11, weight: '600' } } }
            }
          }
        });
      }

      // 2. Gráfico Temporal Acumulado
      const dateSet = new Set();
      state.errors.forEach(e => {
        if (e.date) dateSet.add(e.date);
        if (e.overcomeAt) dateSet.add(e.overcomeAt.split('T')[0]);
      });
      const sortedDates = Array.from(dateSet).sort();
      const cumTotal = [];
      const cumSuperado = [];

      sortedDates.forEach(d => {
        cumTotal.push(state.errors.filter(e => e.date <= d).length);
        cumSuperado.push(state.errors.filter(e => e.priority === 'superado' && ((e.overcomeAt ? e.overcomeAt.split('T')[0] : e.date) <= d)).length);
      });

      const ctxTime = document.getElementById('evo-timeline-chart');
      if (ctxTime) {
        activeCharts.evoTimeline = new Chart(ctxTime, {
          type: 'line',
          data: {
            labels: sortedDates.map(formatDateBR),
            datasets: [
              {
                label: 'Total Catalogado',
                data: cumTotal,
                borderColor: '#4f46e5',
                backgroundColor: 'rgba(79, 70, 229, 0.1)',
                fill: true,
                tension: 0.3,
                borderWidth: 2.5
              },
              {
                label: 'Erros Superados',
                data: cumSuperado,
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.12)',
                fill: true,
                tension: 0.3,
                borderWidth: 2.5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: {
              y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } },
              x: { grid: { display: false } }
            }
          }
        });
      }
    }

                          <button onclick="removeTopicFromSubject('${subj.id}', '${escapeHTML(t).replace(/'/g, "\\'")}')" class="text-indigo-400 hover:text-rose-600 ml-0.5" title="Remover tópico">×</button>

    function handleAddSubject(event) {
      event.preventDefault();
      const input = document.getElementById('new-subject-name');
      const name = input.value.trim();
      if (!name) return;
      if (state.subjects.some(s => s.name.toLowerCase() === name.toLowerCase())) {
        return showToast('Essa matéria já está cadastrada.', 'warning');
      }
      state.subjects.push({ id: generateId('sub'), name, topics: [] });
      state.subjects.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
      recordHistory('Nova matéria adicionada', name);
      saveState();
      showToast(`Matéria "${name}" cadastrada!`, 'success');
      navigate('materias');
    }

    function handleAddTopic(event, subjId) {
      event.preventDefault();
      const input = document.getElementById(`topic-input-${subjId}`);
      const topic = input.value.trim();
      if (!topic) return;
      const subj = state.subjects.find(s => s.id === subjId);
      if (!subj) return;
      if (subj.topics.some(t => t.toLowerCase() === topic.toLowerCase())) {
        return showToast('Esse tópico já existe nessa matéria.', 'warning');
      }
      subj.topics.push(topic);
      saveState();
      showToast(`Tópico "${topic}" adicionado!`, 'success');
      navigate('materias');
    }

    function removeTopicFromSubject(subjId, topicName) {
      const subj = state.subjects.find(s => s.id === subjId);
      if (!subj) return;
      subj.topics = subj.topics.filter(t => t !== topicName);
      saveState();
      navigate('materias');
    }

    function confirmDeleteSubject(subjId) {
      const subj = state.subjects.find(s => s.id === subjId);
      if (!subj) return;
      const linked = state.errors.filter(e => e.subject === subj.name).length;
      if (linked > 0) {
        return showToast(`Não é possível excluir "${subj.name}" pois existem ${linked} erro(s) vinculado(s).`, 'error');
      }
      openConfirmModal('Excluir matéria?', `Deseja remover a matéria "${subj.name}" da lista?`, () => {
        state.subjects = state.subjects.filter(s => s.id !== subjId);
        saveState();
        showToast('Matéria removida.', 'info');
        navigate('materias');
      });
    }

    function exportBackupJSON() {
      const payload = {
        app: 'Caderno de Erros | EDUARDO LANDIM',
        version: '1.0',
        exportedAt: new Date().toISOString(),
        data: state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `caderno_de_erros_eduardo_landim_${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup JSON exportado com sucesso!', 'success');
    }

    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const dataObj = parsed.data ? parsed.data : parsed;
          if (!dataObj || !Array.isArray(dataObj.errors)) {
            throw new Error('Estrutura JSON inválida: lista de erros não encontrada.');
          }
          const importedErrors = dataObj.errors.map(normalizeErrorRecord);
          const importedSubjects = Array.isArray(dataObj.subjects) ? dataObj.subjects : state.subjects;

          openConfirmModal(
            'Restaurar backup JSON?',
            `Foram encontrados ${importedErrors.length} registro(s) no arquivo. Ao confirmar, seus registros atuais serão substituídos pelos do backup (registros antigos sem origem ficarão como "Não classificado").`,
            () => {
              state.errors = importedErrors;
              state.subjects = importedSubjects;
              state.history = Array.isArray(dataObj.history) ? dataObj.history : state.history;
              syncSubjectsFromErrors();
              recordHistory('Backup importado', `${importedErrors.length} registro(s) restaurado(s)`);
              saveState();
              showToast(`Backup restaurado com ${importedErrors.length} registros!`, 'success');
              navigate('dashboard');
            }
          );
        } catch (err) {
          showToast('Arquivo inválido. Selecione um backup JSON gerado por este aplicativo.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function confirmClearAllData() {
      openConfirmModal(
        'Apagar todos os registros?',
        'Isso removerá todos os erros cadastrados e o histórico deste navegador. Recomendamos exportar um backup JSON antes.',
        () => {
          state.errors = [];
          state.history = [];
          saveState();
          showToast('Todos os registros foram apagados.', 'info');
          navigate('dashboard');
        }
      );
    }
